# Build pyDAC once and publish it with PyPI trusted publishing (no API token).
# - A published GitHub release uploads to PyPI; its tag must be v<package version>.
# - "Run workflow" (workflow_dispatch) uploads to TestPyPI (trial) or to PyPI.
# PyPI and TestPyPI each need a trusted publisher for this repository, this file
# (release.yml) and the environment named below (pypi / testpypi).
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/pydac/utils/version.py').read()).group(1))")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - name: Build wheel and sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
